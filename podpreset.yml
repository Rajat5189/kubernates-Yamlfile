apiVersion: settings.k8s.io/v1alpha1
kind: PodPreset
metadata:
  name: inject-config
  namespace: default
spec:
  selector:
    matchLabels:
      app: myapp
  env:
    - name: DATABASE_URL
      value: "mysql://mysql.default.svc.cluster.local:3306"
  volumeMounts:
    - name: config-volume
      mountPath: /etc/config
  volumes:
    - name: config-volume
      configMap:
        name: myapp-config

