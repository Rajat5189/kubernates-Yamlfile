apiVersion: v1
kind: ReplicationController
metadata:
  name: nginx
spec:
  replicas: 2
  selector:
    app: nginx
    app1: frontend
    env: prod
  template:
    metadata:
      labels:
        app:  nginx
        app1: frontend
        env:  prod
    spec:
      containers:
      - name: nginx
        image: nginx

