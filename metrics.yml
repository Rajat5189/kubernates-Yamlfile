apiVersion: v1
kind: Namespace
metadata:
  name: metrics
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metrics-server
  namespace: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-server
  namespace: metrics
  labels:
    k8s-app: metrics-server
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: metrics-server
  template:
    metadata:
      labels:
        k8s-app: metrics-server
    spec:
      serviceAccountName: metrics-server
      containers:
      - name: metrics-server
        image: k8s.gcr.io/metrics-server/metrics-server:v0.12.2
        args:
        - --cert-dir=/tmp
        - --secure-port=4443
        - --kubelet-insecure-tls                   # TLS errors bypass
        - --kubelet-preferred-address-types=InternalIP  # Node internal IPs use
        ports:
        - containerPort: 4443
          name: main-port
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-server
  namespace: metrics
  labels:
    k8s-app: metrics-server
spec:
  selector:
    k8s-app: metrics-server
  ports:
  - port: 443
    targetPort: 4443

